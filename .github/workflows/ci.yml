name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Reads the pinned version from package.json "packageManager".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm --filter web --filter @step-by-step/api-client run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --all-packages installs the workspace members (apps/api) too; the root
      # project is virtual and carries only the shared dev toolchain.
      - run: uv sync --locked --all-packages

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  # The integration tier: the same pytest suite, run against real services.
  # These come from `docker compose up`, the same file a developer runs, rather
  # than from service containers — Garage needs its mounted config, which a
  # service container cannot have because it starts before the checkout. The
  # URLs arrive only in the environment, and they are `.env.example`'s.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql+psycopg://stepbystep:stepbystep@localhost:5433/stepbystep
      REDIS_URL: redis://localhost:6380/0
      S3_ENDPOINT_URL: http://localhost:3910
      S3_PUBLIC_ENDPOINT: http://localhost:3910
      S3_ACCESS_KEY_ID: stepbystep
      S3_SECRET_ACCESS_KEY: stepbystepstepbystepstepbystep
      S3_BUCKET: artifacts
      S3_REGION: garage
      # Public dev-only key from .env.example, for the Auth State store tests.
      STEPBYSTEP_MASTER_KEY: ZGV2LW9ubHkgbWFzdGVyIGtleSAtIG5ldmVyIHNoaXA=

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked --all-packages

      # Docker otherwise creates these bind sources as root-owned 0755
      # directories; the unprivileged services cannot create their sockets.
      - name: Prepare socket directories
        run: install -d -m 1777 .dev/run/pg .dev/run/redis

      # Only the backing services: the api and worker images are not built
      # here, and nothing in this tier needs them.
      - run: docker compose up -d --wait postgres redis garage

      - run: uv run pytest -m integration

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs postgres redis garage

  # The browser tier: the selector-resolution tests, which need a real browser
  # and nothing else. Playwright's Chromium is not part of `uv sync`, so this
  # job installs it; the fast tier stays installable and green without one.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked --all-packages

      - run: uv run playwright install --with-deps chromium

      - run: uv run pytest -m browser

  # The committed openapi.json and generated client must match the FastAPI app.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages

      - run: pnpm --filter api run build
      - run: pnpm --filter @step-by-step/api-client run build
      - run: git diff --exit-code
