[project]
name = "step-by-step-core"
version = "0.1.0"
description = "The shared internal library: the seam Workers and the backend both write through"
requires-python = ">=3.14"
dependencies = ["boto3>=1.43", "psycopg[binary]>=3.2", "redis>=6", "sqlalchemy>=2"]

[build-system]
requires = ["uv_build>=0.12.3,<1"]
build-backend = "uv_build"
