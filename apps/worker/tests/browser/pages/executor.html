<!doctype html>
<html>
  <body>
    <label>Name <input data-testid="name" /></label>
    <label>Password <input data-testid="password" type="password" /></label>
    <button
      data-testid="save"
      onclick="document.body.dataset.saved = document.querySelector('input').value"
    >
      Save
    </button>
  </body>
</html>
