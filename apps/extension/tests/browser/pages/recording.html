<!doctype html>
<meta charset="utf-8" />
<title>Recorder fixture</title>
<button data-testid="save">Save</button>
<button data-testid="second">Second</button>
<button title="Repeated title">One repeated title</button>
<button title="Repeated title">Another repeated title</button>
<label>Email <input data-testid="email" placeholder="Email address" /></label>
<label>Password <input data-testid="password" type="password" /></label>
<label
  >Country
  <select data-testid="country">
    <option value="de">Germany</option>
    <option value="nl">Netherlands</option>
  </select></label
>
<a data-testid="next" href="/destination.html">Next page</a>
<button id="overlay-control" aria-label="Play the video">
  Rick Astley - Never Gonna Give You Up (Official Video) (4K Remaster)Tap to unmute2xInfoShoppingIf
  playback doesn't begin shortly, try restarting your device
</button>
<div id="positional-control" onclick="void 0">
  Rick Astley - Never Gonna Give You Up (Official Video) (4K Remaster)Tap to unmute2xInfoShoppingIf
  playback doesn't begin shortly, try restarting your device
</div>
<div id="suggestions"><div id="suggestion">Rick roll</div></div>
<button id="routing-control">Go to the video</button>
<div id="sealed-control"></div>
<iframe id="unreachable-frame" title="Embedded actions"></iframe>
<script>
  document.querySelector("#unreachable-frame").src =
    `http://localhost:${location.port}/destination.html`;
  const sealed = document.querySelector("#sealed-control").attachShadow({ mode: "closed" });
  const sealedButton = document.createElement("button");
  sealedButton.textContent = "Sealed action";
  sealed.append(sealedButton);
  // A search suggestion: it acts on the press, routes in the page, and takes itself
  // off screen, so the release lands elsewhere and no click is ever dispatched.
  document.querySelector("#suggestion").addEventListener("mousedown", () => {
    history.pushState({}, "", "/recording.html?picked=rick+roll");
    document.querySelector("#suggestions").remove();
  });
  document.querySelector("#routing-control").addEventListener("click", () => {
    history.pushState({}, "", "/recording.html?watch=video");
  });
  for (const button of document.querySelectorAll("button")) {
    button.addEventListener("click", () => {
      document.body.dataset.lastClick = button.textContent;
    });
  }
</script>
