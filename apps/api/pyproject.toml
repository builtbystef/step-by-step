[project]
name = "step-by-step-api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.19.1",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2",
  "step-by-step-core",
  "uvicorn[standard]>=0.52.1",
]

[tool.uv.sources]
step-by-step-core = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.28"]

[build-system]
requires = ["uv_build>=0.12.3,<1"]
build-backend = "uv_build"
