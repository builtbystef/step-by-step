[project]
name = "step-by-step-api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = ["alembic>=1.19.1", "fastapi>=0.115", "sqlalchemy>=2", "uvicorn[standard]>=0.52.1"]

[dependency-groups]
dev = ["httpx>=0.28"]

[build-system]
requires = ["uv_build>=0.12.3,<1"]
build-backend = "uv_build"
