[project]
name = "step-by-step-api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.19.1",
  # Cron parsing and next-occurrence (issue g461z0 / spec 9gea5p).
  # Timezones stay on the standard library's zoneinfo.
  "croniter>=6.2",
  "fastapi>=0.115",
  # The Resend mailer adapter's HTTP client (and what fastapi's TestClient
  # drives the app through).
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pynacl>=1.6",
  "sqlalchemy>=2",
  "step-by-step-core",
  "uvicorn[standard]>=0.52.1",
]

[project.scripts]
rotate-master-key = "step_by_step_api.cli:main"

[tool.uv.sources]
step-by-step-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<1"]
build-backend = "uv_build"
