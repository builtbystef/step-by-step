# The development stack. `docker compose up -d` starts it; the services it
# holds are long-lived shared state that dev, tests, and CI all reach over
# localhost.
#
# Postgres, Redis, and Garage publish host ports so that the application
# processes a developer runs with `pnpm dev` reach them. The backend and the
# Workers run inside the stack as well, reaching each other by service name.
name: step-by-step

# What every process in the stack is told about the stack. Inside the network
# the services answer to their own names on their native ports, so none of
# these are the published host ports a developer's `pnpm dev` uses.
x-stack-environment: &stack-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stepbystep}:${POSTGRES_PASSWORD:-stepbystep}@postgres:5432/${POSTGRES_DB:-stepbystep}
  REDIS_URL: redis://redis:6379/0
  # The Artifact store's two endpoints. The internal one is where objects are
  # read and written; the public one is what a presigned URL is signed for,
  # because the browser that follows it resolves neither `garage` nor this
  # network. Signing with the internal endpoint breaks every real download.
  S3_ENDPOINT_URL: http://garage:3900
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:3910}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-stepbystep}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-stepbystepstepbystepstepbystep}
  S3_BUCKET: ${S3_BUCKET:-artifacts}
  S3_REGION: garage
  # Shared Worker → backend token (54i6da's posture). One secret for the
  # fixed compose pool; per-Worker credentials would need a provisioning
  # step the stack does not have. A real deployment overrides the default.
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
  # Shared VNC passwords (5yu03g). The backend proxy authenticates to each
  # Worker's x11vnc with the view-only password unless the connecting session
  # holds takeover. VNC passwords are 8 characters; longer values truncate.
  VNC_CONTROL_PASSWORD: ${VNC_CONTROL_PASSWORD:-devctl01}
  VNC_VIEW_PASSWORD: ${VNC_VIEW_PASSWORD:-devview1}

x-stack-is-up: &stack-is-up
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  garage:
    condition: service_healthy

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stepbystep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stepbystep}
      POSTGRES_DB: ${POSTGRES_DB:-stepbystep}
    ports:
      # 5433 on the host by default: 5432 is the port a developer's other
      # project already holds. Override with POSTGRES_PORT.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The unix socket, published into the repository for the sandboxed
      # coding agents: their sandbox isolates the network namespace, so the
      # host port above is unreachable from inside it — the socket is not.
      #
      # Mount a sibling of /var/run/postgresql, never that directory itself.
      # The official image chowns /var/run/postgresql as root on boot, and
      # Docker Desktop's host bind (/host_mnt/...) refuses the chown, so the
      # container exits. The image keeps its own socket dir; we ask Postgres
      # to listen on this one too.
      - ./.dev/run/pg:/var/run/postgresql-sandbox
    command:
      ["postgres", "-c", "unix_socket_directories=/var/run/postgresql,/var/run/postgresql-sandbox"]
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stepbystep} -d ${POSTGRES_DB:-stepbystep}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8
    restart: unless-stopped
    # The unix socket serves the sandboxed coding agents, exactly as the
    # Postgres socket above does; TCP on 6379 keeps serving everything else.
    command:
      ["redis-server", "--unixsocket", "/var/run/redis/redis.sock", "--unixsocketperm", "777"]
    volumes:
      - ./.dev/run/redis:/var/run/redis
    ports:
      # 6380 on the host by default, for the same reason Postgres takes 5433:
      # a developer's other project already holds 6379. Override with REDIS_PORT.
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    # --single-node writes the one-node layout on first boot and
    # --default-bucket creates the access key and the bucket from the
    # GARAGE_DEFAULT_* variables below. No init sidecar, no manual step.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Dev defaults, deliberately fixed so a cold `docker compose up` works
      # with no .env at all. A real deployment overrides every one of them.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-4f1a0c53b9d84e27a6f30b1c8d5e792a3c6b04f8e19d27a5b3c60e8f1d4a7920}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-devadmintoken}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-stepbystep}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-stepbystepstepbystepstepbystep}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-artifacts}
    ports:
      # The S3 API on 3910, not its native 3900: another project on the same
      # machine already holds 3900, exactly as it holds 5432 and 6379. The
      # presigned URLs the backend mints are followed by the user's browser,
      # which resolves this address and not `garage`, so this is the port
      # S3_PUBLIC_ENDPOINT names. Override with GARAGE_S3_PORT.
      - "${GARAGE_S3_PORT:-3910}:3900"
    volumes:
      - ./compose/garage.toml:/etc/garage.toml:ro
      # Both named: without them the store is wiped when the container is
      # replaced, and objects must survive `docker compose down && up`.
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image carries no shell, so this is the binary's own status command.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      # The repository root: both images are built from the uv workspace.
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *stack-environment
      # The vault's master key, and the one variable that is deliberately not
      # in the shared anchor: the backend holds it and the Workers never do
      # (ADR 0004). The backend refuses to start unless it is base64 of 32
      # bytes. A dev default, on the same terms as Garage's above, so that a
      # cold `docker compose up` needs no .env — a real deployment overrides
      # it, and losing the key it replaces makes every stored value
      # unrecoverable, by design.
      STEPBYSTEP_MASTER_KEY: ${STEPBYSTEP_MASTER_KEY:-ZGV2LW9ubHkgbWFzdGVyIGtleSAtIG5ldmVyIHNoaXA=}
      # The mailer, on the api service alone for the same reason: the backend
      # sends every email and the Workers send none. console by default, so a
      # cold `docker compose up` needs no mail service; the adapter variables
      # pass through empty and are read only by the adapter that MAILER names.
      MAILER: ${MAILER:-console}
      MAIL_FROM: ${MAIL_FROM:-step-by-step@localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Who may sign up. `open` lets anyone who controls an email address make
      # an account; `invite_only` takes nobody the Organization has not
      # invited. There is no instance administrator and no settings table to
      # hold this (ADR 0005), so an exposed instance is closed here or not at
      # all. The Workers never read it — they serve no one.
      SIGNUP_MODE: ${SIGNUP_MODE:-open}
      # The instance default IANA timezone for a new Schedule. Unset is UTC.
      # The Workers never read it.
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
    ports:
      # 8001, because `pnpm dev` runs a backend on the host's 8000 and the two
      # are meant to coexist. Override with API_PORT.
      - "${API_PORT:-8001}:8000"
    depends_on: *stack-is-up

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *stack-environment
      # Where this Worker POSTs heartbeats. Inside the network that is the
      # api service's own name; a host-run Worker points at localhost:8000.
      API_URL: http://api:8000
    # Deliberately no `ports`. The Worker's VNC server must be reachable from
    # the backend over this network and from nowhere else — publishing it would
    # put a browser someone is signed into on the host. It is also what lets
    # `docker compose up --scale worker=N` work: with no published port there
    # is nothing for a second replica to collide with.
    shm_size: 1gb # Chromium fails on the 64MB default.
    depends_on: *stack-is-up

volumes:
  postgres-data:
  garage-meta:
  garage-data:
